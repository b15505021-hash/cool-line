name: COOL-LINE 每日雲端登入同步

on:
  schedule:
    # 每天早上 07:55 (台北時間 UTC+8) 早安報平安＋今日／2天後死線預告，對應 UTC 23:55
    - cron: '55 23 * * *'
    # 每週日晚上 20:00 (台北時間 UTC+8) 未來 7 天戰況總覽，對應 UTC 12:00
    - cron: '0 12 * * 0'
    # 每天晚上 23:00 (台北時間 UTC+8) 最後 1 小時未繳交搶救提醒，對應 UTC 15:00
    - cron: '0 15 * * *'
  workflow_dispatch: # 支援手動一鍵觸發測試

jobs:
  sync-cool:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.12（啟用 pip 快取）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 安裝 Python 相依套件
        run: pip install -r requirements.txt

      - name: 快取 Playwright Chromium 瀏覽器核心
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: 安裝 Playwright Chromium 無頭瀏覽器
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium --with-deps
          else
            playwright install-deps chromium
          fi

      - name: 執行 NTU COOL 自動登入與未繳交同步
        env:
          NTU_STUDENT_ID: ${{ secrets.NTU_STUDENT_ID }}
          NTU_PASSWORD: ${{ secrets.NTU_PASSWORD }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: python cloud_sync.py
